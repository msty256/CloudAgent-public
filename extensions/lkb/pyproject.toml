[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lkb"
version = "0.2.0"
description = "Persistent Plan Graph runtime for CloudAgent TaskV2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "CloudAgent Authors"},
]
keywords = ["plan-graph", "task-management", "kanban"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
