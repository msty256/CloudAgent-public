name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # 装 `kb` extra：稠密检索（faiss）是**可选运行时依赖**，不装也能跑，
          # 但装上了 tests/diagnosis/knowledge/test_vector.py 的稠密层才有真实覆盖，
          # 否则那 13 个用例会走 skip 分支——CI 就测不到这条路径了。
          # onnxruntime / tokenizers 只影响真实模型推理，测试用假 embedder，不必带。
          pip install -e ".[db,dev]" faiss-cpu
          # 单测超时：卡死时立刻失败并打印栈，而不是吃满 job 超时
          pip install pytest-timeout

      - name: Show environment
        run: |
          python --version
          cloudagent --version || true

      - name: Diagnosis tests
        run: pytest tests/diagnosis -q --no-header -p no:cacheprovider

      - name: Skills tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          pytest tests/skills -q --no-header -p no:cacheprovider \
            --timeout=120 --timeout-method=thread --durations=10 2>&1 | tee /tmp/skills.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -25 /tmp/skills.txt | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: CLI tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          pytest tests/cli -q --no-header -p no:cacheprovider \
            --timeout=120 --timeout-method=thread --durations=10 2>&1 | tee /tmp/cli.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -25 /tmp/cli.txt | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
